<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">Cadastro</h3>
                    </div>
                    <div class="card-body">
                        <form id="cadForm">
                            <div class="mb-3">
                                <label for="username_cad" class="form-label">Usuário</label>
                                <input type="text" class="form-control" id="username_cad" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password_cad" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="password_cad" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                        </form>
                    </div>
                </div>
                <div id="response" class="mt-3" style="display: none;">
                    <div class="alert alert-success">
                        <strong>Usuário criado com sucesso: </strong> <span id="nameReponse"></span>
                    </div>
                </div>
                <div id="error-message" class="alert alert-danger mt-3" style="display: none;">
                    <strong>Erro!</strong> <span id="error-text"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/js/cadastro.js"></script>
</body>
</html>
